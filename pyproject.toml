[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-legal-rag"
version = "0.1.0"
description = "Matter-segregated retrieval over legal documents, entirely on local infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "model2vec>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_rag = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
